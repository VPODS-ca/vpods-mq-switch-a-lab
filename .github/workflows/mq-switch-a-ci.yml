name: mq-switch-a-ci
on:
  pull_request:
  push:
    branches: [main, "vpods/hire"]
  merge_group:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
      - name: Fail if FAIL marker present
        run: |
          if [ -f FAIL ]; then
            echo "FAIL marker present — simulating broken candidate"
            exit 1
          fi
          echo "PASS"
